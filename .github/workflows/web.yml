# Builds the Web export and publishes it to GitHub Pages, so the game can be
# played in the browser at https://<owner>.github.io/<repo>/.
# Runs on every push to main (and by hand from the Actions tab).
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Publish web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -qj templates.tpz templates/web_nothreads_release.zip \
              templates/web_nothreads_debug.zip templates/version.txt -d "$templates"
          rm templates.tpz godot.zip

      - name: Export the Web preset
        run: |
          "$RUNNER_TEMP/godot" --headless --import
          mkdir -p build/web
          "$RUNNER_TEMP/godot" --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
